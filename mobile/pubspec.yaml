name: agenkin
description: "Aplicación Android de AgenKin para usuarios finales."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  freezed_annotation: 3.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.2
  flutter_secure_storage: 10.3.1
  go_router: 17.3.0
  intl: 0.20.3
  shared_preferences: 2.5.5
  supabase_flutter: 2.16.0
  url_launcher: 6.3.2

dev_dependencies:
  build_runner: 2.15.1
  freezed: 3.2.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
