project_id = "kpqzwbhprqlapwhadejt"

[auth]
site_url = "https://kinoguerra.github.io/AgenKin/"
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
additional_redirect_urls = [
  "http://localhost:5173/AgenKin/auth-callback.html",
  "http://127.0.0.1:5173/AgenKin/auth-callback.html",
  "https://kinoguerra.github.io/AgenKin/auth-callback.html",
  "com.kinovich.agenkin://login-callback/",
]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8

[functions.google-oauth-callback]
verify_jwt = false

[functions.admin-manage-user]
verify_jwt = true

[functions.google-oauth-start]
verify_jwt = true

[functions.google-disconnect]
verify_jwt = true

[functions.scan-gmail]
verify_jwt = true

[functions.create-calendar-event]
verify_jwt = true

[functions.sync-gmail-scheduled]
verify_jwt = false

[functions.process-gmail-queue]
verify_jwt = false

[functions.create-calendar-scheduled]
verify_jwt = false

[functions.process-calendar-queue]
verify_jwt = false
